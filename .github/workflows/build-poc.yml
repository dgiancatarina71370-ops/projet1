# Optionnel : compile l'exe de validation sur un serveur Windows, sans rien installer sur votre PC.
# Utilisation : depot GitHub prive contenant ce dossier -> onglet Actions -> "Build POC" -> Run workflow -> telecharger l'artefact.
name: Build POC
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ba-mentor-poc
          path: src-tauri/target/release/ba-mentor-poc.exe
