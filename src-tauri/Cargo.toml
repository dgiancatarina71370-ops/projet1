[package]
name = "ba-mentor"
version = "0.2.1"
edition = "2021"
description = "BA-Mentor Portable Ultimate Edition - Développé par David Giancatarina"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
