[package]
name = "ba-mentor"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
description = "BA-Mentor Portable Ultimate Edition - Développé par David Giancatarina"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
